<section id="login" style="min-height: 100vh; padding-top: 120px; display: flex; align-items: center; justify-content: center; background: var(--bg);">
  <div class="contact-form fade-in visible" style="max-width: 450px; width: 100%; box-shadow: var(--shadow-lg);">
    <div class="center" style="margin-bottom: 24px;">
      <div class="nav-logo" style="margin: 0 auto 16px;">E</div>
      <h2 class="section-title" style="font-size: 24px;">Welcome Back</h2>
      <p class="section-sub" style="font-size: 14px;">Log in to access your dashboard</p>
    </div>
    
    <div *ngIf="errorMessage" class="feature-card" style="padding: 10px; margin-bottom: 20px; border-left: 4px solid var(--coral); background: #ffe8e8; color: var(--coral); font-size: 13px;">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" [(ngModel)]="email" placeholder="your@email.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="password" placeholder="••••••••" required />
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px;">
        <label style="display: flex; align-items: center; gap: 8px;"><input type="checkbox"> Remember me</label>
        <a href="#" style="color: var(--primary-light); text-decoration: none; font-weight: 600;">Forgot Password?</a>
      </div>
      <button type="submit" class="btn-send" [disabled]="isLoading">
        <i class="fa fa-right-to-bracket" *ngIf="!isLoading"></i> 
        <i class="fa fa-spinner fa-spin" *ngIf="isLoading"></i>
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <div style="margin-top: 30px; border-top: 1px solid var(--border); padding-top: 20px;">
      <p style="font-size: 12px; color: var(--text3); margin-bottom: 10px; text-align: center;">Demo Accounts (Click to auto-fill)</p>
      <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
        <button *ngFor="let demo of demoAccounts" type="button" class="btn-outline" style="padding: 6px 12px; font-size: 11px; background: var(--bg2); color: var(--primary); border: 1px solid var(--border);" (click)="fillDemo(demo.email, demo.pass)">
          {{ demo.role }}
        </button>
      </div>
    </div>
  </div>
</section>
