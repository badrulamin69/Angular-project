<!-- ✅ navbar.component.html -->
<nav id="navbar" [class.scrolled]="isScrolled">
  <a href="#hero" class="nav-brand">
    <div class="nav-logo">E</div>
    <div class="nav-name">
      Academy Management System
      <span>Smart Learning Management</span>
    </div>
  </a>

  <ul class="nav-links" [class.open]="menuOpen">
    <li><a routerLink="/" (click)="closeMenu()" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
    <li><a routerLink="/admission" (click)="closeMenu()" routerLinkActive="active">Admissions</a></li>
    
    <ng-container *ngIf="user">
      <li><a routerLink="/dashboard" (click)="closeMenu()" routerLinkActive="active">Dashboard</a></li>
      <li><a routerLink="/courses" (click)="closeMenu()" routerLinkActive="active">Courses</a></li>
      <li><a routerLink="/live-classes" (click)="closeMenu()" routerLinkActive="active">Live Classes</a></li>
      
      <!-- Student & Teacher Specific Links -->
      <li *ngIf="user.role === 'Student' || user.role === 'Teacher'">
        <a routerLink="/exams" (click)="closeMenu()" routerLinkActive="active">Exams</a>
      </li>
      <li *ngIf="user.role === 'Student' || user.role === 'Teacher'">
        <a routerLink="/talent-hunt" (click)="closeMenu()" routerLinkActive="active">Talent Hunt</a>
      </li>
      
      <li><a routerLink="/notices" (click)="closeMenu()" routerLinkActive="active">Notices</a></li>
    </ng-container>
  </ul>

  <div class="nav-actions">
    <ng-container *ngIf="!user">
      <a routerLink="/login" class="btn-login" (click)="closeMenu()">
        <i class="fa fa-right-to-bracket"></i> Login
      </a>
    </ng-container>
    
    <ng-container *ngIf="user">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="text-align: right; line-height: 1.2;">
          <div style="font-size: 13px; font-weight: 700; color: var(--primary);">{{ user.name }}</div>
          <div style="font-size: 11px; color: var(--text3);">{{ user.role }}</div>
        </div>
        <button (click)="logout()" class="btn-outline" style="padding: 6px 12px; font-size: 13px; color: var(--coral); border-color: var(--coral);">
          <i class="fa fa-power-off"></i>
        </button>
      </div>
    </ng-container>

    <div class="hamburger" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</nav>
