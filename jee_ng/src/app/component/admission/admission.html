<section style="min-height: 100vh; padding-top: 120px; background: var(--bg);">
  <div class="section-head center fade-in visible">
    <div class="section-tag">Admissions</div>
    <h2 class="section-title">Fully Online Admission</h2>
    <p class="section-sub">Digitizing the entire entry process. Secure your seat for the 2026 academic year.</p>
  </div>
  
  <div class="contact-form fade-in visible" style="max-width: 800px; margin: 0 auto; box-shadow: var(--shadow-lg);">
    <h3 style="margin-bottom: 24px; color: var(--primary);">Student Information</h3>
    <div class="form-row">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" placeholder="Student's first name" />
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" placeholder="Student's last name" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" />
      </div>
      <div class="form-group">
        <label>Gender</label>
        <select>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>
    </div>
    
    <h3 style="margin-top: 30px; margin-bottom: 24px; color: var(--primary);">Academic Details</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Target Grade/Class</label>
        <select>
          <option>Grade 9</option>
          <option>Grade 10</option>
          <option>Grade 11</option>
          <option>Grade 12</option>
        </select>
      </div>
      <div class="form-group">
        <label>Preferred Department</label>
        <select>
          <option>Science</option>
          <option>Commerce</option>
          <option>Arts / Humanities</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Upload Previous Transcripts (PDF)</label>
      <input type="file" style="padding: 9px;" />
    </div>
    
    <button class="btn-send" style="margin-top: 30px; font-size: 16px;"><i class="fa fa-paper-plane"></i> Submit Application</button>
  </div>
</section>
