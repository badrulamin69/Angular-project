<section style="min-height: 100vh; padding-top: 120px; background: var(--bg);">
  <div class="section-head center fade-in visible">
    <div class="section-tag">Creative Module</div>
    <h2 class="section-title">Talent Hunt Showcase</h2>
    <p class="section-sub">Submit your poetry, stories, and essays to showcase your creativity.</p>
  </div>
  
  <div class="contact-grid fade-in visible">
    <div class="contact-info">
      <h3>Current Competitions</h3>
      <div class="feature-card" style="margin-bottom: 20px;">
        <h4 style="color: var(--primary);">Spring Poetry Contest</h4>
        <p>Deadline: May 20, 2026</p>
        <button class="btn-enroll" style="width: auto; padding: 5px 15px;">View Details</button>
      </div>
      <div class="feature-card">
        <h4 style="color: var(--primary);">Short Story Writing</h4>
        <p>Deadline: June 1, 2026</p>
        <button class="btn-enroll" style="width: auto; padding: 5px 15px;">View Details</button>
      </div>
    </div>
    
    <div class="contact-form">
      <h3 style="margin-bottom: 20px; color: var(--primary);">Submit Your Work</h3>
      <div class="form-group">
        <label>Title of Work</label>
        <input type="text" placeholder="Enter title" />
      </div>
      <div class="form-group">
        <label>Category</label>
        <select>
          <option>Poetry</option>
          <option>Short Story</option>
          <option>Essay</option>
        </select>
      </div>
      <div class="form-group">
        <label>Upload File (PDF/DOCX)</label>
        <input type="file" style="padding: 9px;" />
      </div>
      <button class="btn-send"><i class="fa fa-upload"></i> Submit Entry</button>
    </div>
  </div>
</section>
